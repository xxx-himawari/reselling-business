services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: reselling
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: reselling
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - reselling_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reselling -d reselling"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  reselling_pgdata:
